[project]
name = "provisioning-consumer-lib"
version = "0.9.2"
description = "Library for provisioning consumer event handling and DN parsing"
requires-python = ">=3.11"
dependencies = [
    "ldap3",
    "requests>=2.32.0",
    "loguru",
    "typing-extensions",
]

[project.optional-dependencies]
python-ldap = [
    "python-ldap>=3.4.0",
]
test = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/provisioning_consumer_lib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
