[project]
name = "provisioning-consumer"
version = "0.1.0"
description = "A Provisioning consumer"
requires-python = ">=3.11"
dependencies = [
    "ldap3",
    "requests>=2.32.0",
]

[project.optional-dependencies]
python-ldap = [
    "python-ldap>=3.4.0",
]
test = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[project.scripts]
provisioning-consumer = "provisioning_consumer.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/provisioning_consumer"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
