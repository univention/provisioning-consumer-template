[project]
name = "provisioning-consumer"
version = "0.9.4"
description = "A Provisioning consumer application (template)"
requires-python = ">=3.11"
dependencies = [
    "provisioning-consumer-lib",
    "loguru",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[tool.uv.sources]
provisioning-consumer-lib = { path = "lib" }

[project.scripts]
provisioning-consumer = "provisioning_consumer.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/provisioning_consumer"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
