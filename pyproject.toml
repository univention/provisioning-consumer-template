[project]
name = "provisioning-consumer"
version = "0.9.8"
description = "A Provisioning consumer application (template)"
requires-python = ">=3.11"
dependencies = [
    "provisioning-consumer-lib",
    "loguru",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "pytest-cov>=6.0",
]

[tool.uv.sources]
provisioning-consumer-lib = { path = "lib" }

[project.scripts]
provisioning-consumer = "provisioning_consumer.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/provisioning_consumer"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--cov=provisioning_consumer_lib --cov-report=term-missing"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "raise NotImplementedError\\(\\)",
    "if __name__ == .__main__.:",
]
